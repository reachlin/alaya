<meta charset="utf-8">
<title>Alaya General Arrangement Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  :root{
    --sheet:#0B2E4F; --sheet-deep:#08233E;
    --line:#CBDDEC; --line-bright:#F2F8FD; --muted:#7FA5C4;
    --faint:rgba(203,221,236,.34);
    --grid:rgba(203,221,236,.075); --grid-major:rgba(203,221,236,.14);
    --gold:#E6B25C; --verm:#E4795A;
    --draft:"Saira Condensed","Arial Narrow",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --han:"Noto Sans SC","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:1200px;overflow:hidden;
    background-color:var(--sheet);
    background-image:
      repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px 16px),
      repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px 16px),
      repeating-linear-gradient(to right,var(--grid-major) 0 1px,transparent 1px 96px),
      repeating-linear-gradient(to bottom,var(--grid-major) 0 1px,transparent 1px 96px);
    color:var(--line);
    font-family:var(--draft);
    -webkit-font-smoothing:antialiased;
  }
  .plate{
    width:1200px;height:1200px;padding:34px;
    display:flex;flex-direction:column;
  }
  .frame{
    flex:1;border:1px solid var(--faint);outline:3px solid var(--faint);outline-offset:5px;
    padding:30px 34px 22px;display:flex;flex-direction:column;position:relative;
  }
  .frame::before,.frame::after{content:"";position:absolute;width:20px;height:20px}
  .frame::before{top:9px;left:9px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .frame::after{bottom:9px;right:9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}

  .eyebrow{
    font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);
    margin:0 0 10px;
  }
  h1{
    font-size:62px;line-height:.98;letter-spacing:.045em;text-transform:uppercase;
    font-weight:700;color:var(--line-bright);margin:0 0 12px;
  }
  .sub{
    font-family:var(--mono);font-size:15px;color:var(--muted);
    margin:0 0 4px;letter-spacing:.01em;
  }
  .hr{border:0;border-top:1px solid var(--faint);margin:18px 0 0}
  figure{margin:0;flex:1;display:flex;align-items:center}
  svg{width:100%;height:auto;display:block}

  .lbl{font-family:var(--draft);font-size:17px;letter-spacing:.09em;text-transform:uppercase;fill:var(--line)}
  .lbl-sm{font-family:var(--draft);font-size:14px;letter-spacing:.13em;text-transform:uppercase;fill:var(--muted)}
  .han-lbl{font-family:var(--han);font-size:20px;fill:var(--line-bright)}
  .han-sm{font-family:var(--han);font-size:16px;fill:var(--muted)}
  .mono-lbl{font-family:var(--mono);font-size:13.5px;fill:var(--muted)}

  .tb{
    display:grid;grid-template-columns:2.1fr 1fr 1fr 1.15fr;
    border:1px solid var(--line);margin-top:18px;
  }
  .tb div{padding:10px 14px;border-right:1px solid var(--faint)}
  .tb div:last-child{border-right:0}
  .tb .k{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
  .tb .v{font-family:var(--mono);font-size:15px;color:var(--line-bright)}
  .tb .v.big{font-family:var(--draft);font-size:17px;letter-spacing:.11em;text-transform:uppercase}
</style>

<div class="plate"><div class="frame">

  <p class="eyebrow">Ālaya · 阿賴耶 — general arrangement</p>
  <h1>Eight Consciousnesses,<br>One Stream</h1>
  <p class="sub">A 4th-century Yogācāra analysis of mind, drawn as the agent architecture it turned out to specify.</p>
  <hr class="hr">

  <figure>
  <svg viewBox="0 0 1100 700" role="img" aria-label="Ālaya general arrangement: five senses feed the sixth consciousness, the only layer that acts; the eighth-consciousness store exchanges seeds with it both ways; the seventh consciousness reads the store and biases the sixth.">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#CBDDEC"/></marker>
      <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E6B25C"/></marker>
      <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#E4795A"/></marker>
    </defs>

    <g fill="none" stroke="#CBDDEC" stroke-width="1.5">
      <rect x="30" y="24" width="520" height="104"/>
      <rect x="30" y="212" width="520" height="132"/>
      <rect x="30" y="470" width="520" height="176"/>
    </g>
    <rect x="676" y="250" width="394" height="206" fill="none" stroke="#E4795A" stroke-width="1.5"/>

    <text class="han-lbl" x="52" y="60">前五識 · senses/</text>
    <text class="lbl-sm" x="52" y="85">EYE · EAR · NOSE · TONGUE · BODY</text>
    <text class="mono-lbl" x="52" y="110">現量 only — a signal, never a name</text>

    <text class="han-lbl" x="52" y="250">第六意識 · mano.py</text>
    <text class="lbl-sm" x="52" y="275">THE ONLY LAYER THAT ACTS</text>
    <text class="mono-lbl" x="52" y="300">遍緣一切法 · 分別 · 造業最強</text>
    <text class="mono-lbl" x="52" y="324">every act leaves a seed behind it</text>

    <text class="han-lbl" x="52" y="508">第八阿賴耶識 · seeds/</text>
    <text class="lbl-sm" x="52" y="533">APPEND-ONLY — NO UPDATE, NO DELETE</text>
    <text class="mono-lbl" x="52" y="558">無覆無記 — never judges, never refuses</text>
    <text class="mono-lbl" x="52" y="582">恆轉如瀑流 — 種子六義 enforced as invariants</text>
    <text class="mono-lbl" x="52" y="612">變現 → 根身 body · 器世間 world</text>
    <text class="mono-lbl" x="52" y="634">the world is projected from here, not received</text>

    <text class="han-lbl" x="700" y="288" fill="#E4795A">第七末那識 · manas.py</text>
    <text class="lbl-sm" x="700" y="313">ALWAYS ON — THE DESIGNATED BIAS SOURCE</text>
    <text class="mono-lbl" x="700" y="342">恆審思量 — constantly deliberating</text>
    <text class="mono-lbl" x="700" y="366">四煩惱: 我癡 · 我見 · 我慢 · 我愛</text>
    <text class="mono-lbl" x="700" y="398">performs no karma — it only colours</text>
    <text class="mono-lbl" x="700" y="422">audit() measures what it distorts,</text>
    <text class="mono-lbl" x="700" y="442">because it cannot be removed</text>

    <line x1="290" y1="128" x2="290" y2="212" stroke="#CBDDEC" stroke-width="1.5" marker-end="url(#a)"/>
    <text class="han-sm" x="306" y="163">現量 — percepts</text>
    <text class="mono-lbl" x="306" y="184">no label field exists</text>

    <line x1="120" y1="470" x2="120" y2="344" stroke="#E6B25C" stroke-width="2" marker-end="url(#ag)"/>
    <text class="han-sm" x="136" y="396" fill="#E6B25C">種子生現行</text>
    <text class="mono-lbl" x="136" y="418">activate — 待眾緣</text>

    <line x1="452" y1="344" x2="452" y2="470" stroke="#E6B25C" stroke-width="2" marker-end="url(#ag)"/>
    <text class="han-sm" x="436" y="396" fill="#E6B25C" text-anchor="end">現行熏種子</text>
    <text class="mono-lbl" x="436" y="418" text-anchor="end">perfume</text>

    <path d="M550,560 L860,560 L860,458" fill="none" stroke="#E4795A" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#av)"/>
    <text class="han-sm" x="596" y="546" fill="#E4795A">緣第八識見分 — takes the knowing for a knower</text>

    <line x1="676" y1="302" x2="554" y2="302" stroke="#E4795A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#av)"/>
    <text class="han-sm" x="615" y="284" fill="#E4795A" text-anchor="middle">恆審思量</text>
    <text class="mono-lbl" x="613" y="262" text-anchor="middle">→ every prompt</text>

    <path d="M550,244 L622,244 L622,168" fill="none" stroke="#CBDDEC" stroke-width="1.5" marker-end="url(#a)"/>
    <text class="lbl-sm" x="638" y="160">THE WORLD</text>
    <text class="mono-lbl" x="638" y="182">造業 — the only outward motion</text>

    <line x1="32" y1="682" x2="76" y2="682" stroke="#E6B25C" stroke-width="2"/>
    <text class="mono-lbl" x="86" y="687">因果引擎 the seed circuit</text>
    <line x1="330" y1="682" x2="374" y2="682" stroke="#E4795A" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="mono-lbl" x="384" y="687">我執 the bias path — named and measured, never removed</text>
  </svg>
  </figure>

  <div class="tb">
    <div><span class="k">Drawing</span><span class="v big">Ālaya — general arrangement</span></div>

</div></div>
